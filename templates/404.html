<!DOCTYPE html>
<!--HTML_TAG-->

<head>
    <script src="/static/js/lang-detect.min.js"></script>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title><!--PAGE_TITLE--></title>
    <meta name="description" content="<!--PAGE_DESC-->">
    <meta name="robots" content="noindex, follow">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9332457707004456" crossorigin="anonymous"></script>

    <!-- Performance: Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/cairo-arabic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/inter-latin.woff2" crossorigin>
    <link rel="preload" as="image" type="image/webp" href="/static/img/logo.webp">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap">

    <!-- Critical Inline Styles -->
    <style>
        :root {
            --bg: #020817;
            --bg-secondary: #0F172A;
            --card: #111827;
            --border: #1E293B;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.04);
            --primary: #2563EB;
            --primary-hover: #3B82F6;
            --accent: #06B6D4;
            --text: #F8FAFC;
            --text-secondary: #94A3B8;
            --radius-full: 9999px;
            --radius-md: 1rem;
            --nav-bg: rgba(2, 8, 23, 0.82);
        }

        [data-theme="light"] {
            --bg: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --card: #FFFFFF;
            --border: #E2E8F0;
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass: rgba(255, 255, 255, 0.7);
            --primary: #2563EB;
            --text: #0F172A;
            --text-secondary: #475569;
            --nav-bg: rgba(248, 250, 252, 0.85);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: clip;
            scrollbar-gutter: stable;
            width: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: clip;
            width: 100%;
            min-height: 100svh;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        html[dir="rtl"] body {
            font-family: 'Cairo', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .gt-404-search-box {
            position: relative;
            max-width: 480px;
            margin: 1.75rem auto 2rem;
            width: 100%;
        }

        .gt-404-search-input {
            width: 100%;
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
        }

        .gt-404-search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .gt-404-pills {
            display: flex;
            gap: 0.65rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .gt-404-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .gt-404-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .gt-404-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            max-width: 960px;
            margin: 2rem auto 2.5rem;
            text-align: start;
        }

        .gt-404-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.25rem;
            border-radius: 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: all 0.25s ease;
        }

        .gt-404-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.12);
        }

        .gt-404-card-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            flex-shrink: 0;
            color: #fff;
        }

        .icon-qr { background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%); }
        .icon-thumb { background: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%); }
        .icon-rec { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .icon-compressor { background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%); }
    </style>
    <link rel="preload" href="/static/css/main.min.css" as="style">
    <link rel="stylesheet" href="/static/css/main.min.css" id="gtoolix-main-css" fetchpriority="high">
</head>

<body>
    <!--SITE_NAV-->

    <div class="background-gradient"></div>
    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="particles" id="particles"></div>

    <main class="container" style="max-width: 980px; padding-top: clamp(7.5rem, 13vw, 10.5rem); padding-bottom: 5rem; margin: 0 auto; text-align: center; padding-inline: max(1rem, 3.5vw);">
        <div style="font-size: clamp(4.5rem, 11vw, 7.5rem); font-weight: 900; line-height: 1; margin-bottom: 0.75rem; background: linear-gradient(135deg, #2563EB, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            404
        </div>
        <h1 style="font-size: clamp(1.5rem, 3.5vw, 2.25rem); font-weight: 800; margin-bottom: 0.75rem;">
            <!--ERR_TITLE-->
        </h1>
        <p style="color: var(--text-secondary); font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.75rem; max-width: 580px; margin-inline: auto;">
            <!--ERR_DESC-->
        </p>

        <!-- Search Bar -->
        <div class="gt-404-search-box">
            <input type="search" id="gt-404-search" class="gt-404-search-input" placeholder="<!--SEARCH_PLACEHOLDER-->" aria-label="Search tools and guides" onkeyup="handle404Search(event)">
        </div>

        <!-- Quick Category Navigation Pills -->
        <div class="gt-404-pills">
            <!--CATEGORY_PILLS-->
        </div>

        <!-- Popular Tools Grid -->
        <div style="margin-top: 2rem;">
            <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.04em;">
                <!--POPULAR_TOOLS_TITLE-->
            </h2>
            <div class="gt-404-grid">
                <!--POPULAR_TOOLS_CARDS-->
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2.5rem;">
            <a href="<!--HOME_HREF-->" class="btn btn-primary" style="padding: 0.75rem 1.5rem; text-decoration: none; font-weight: 600;"><!--BTN_HOME--></a>
            <a href="<!--TOOLS_HREF-->" class="btn btn-outline" style="padding: 0.75rem 1.5rem; text-decoration: none; font-weight: 600;"><!--BTN_TOOLS--></a>
        </div>
    </main>

    <!--SITE_FOOTER-->

    <script>
        function toggleNav(forceClose) {
            const links = document.getElementById('site-nav-links');
            const btn = document.getElementById('nav-toggle');
            const backdrop = document.getElementById('nav-backdrop');
            if (!links || !btn) return;
            const shouldOpen = forceClose === true ? false : !links.classList.contains('is-open');
            links.classList.toggle('is-open', shouldOpen);
            if (backdrop) backdrop.classList.toggle('is-open', shouldOpen);
            document.body.classList.toggle('menu-open', shouldOpen);
            btn.setAttribute('aria-expanded', String(shouldOpen));
        }

        function handle404Search(e) {
            if (e.key === 'Enter') {
                const q = e.target.value.trim();
                if (q) {
                    const isEn = window.location.pathname.startsWith('/en');
                    window.location.href = (isEn ? '/en/tools?q=' : '/tools?q=') + encodeURIComponent(q);
                }
            }
        }
    </script>
    <script src="/static/js/theme.min.js" defer></script>
    <script src="/static/js/client.min.js" defer></script>
</body>
</html>
