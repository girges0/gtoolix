    <script>
        // Language System
        let currentLang = (typeof window.getGToolixLanguage === 'function') ? window.getGToolixLanguage() : (function () {
            try {
                var saved = localStorage.getItem('gtoolix_language') || localStorage.getItem('siteLang');
                if (saved === 'ar' || saved === 'en') return saved;
                var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : (navigator.language ? [navigator.language] : []);
                for (var i = 0; i < langs.length; i++) {
                    var code = (langs[i] || '').toLowerCase();
                    if (code.indexOf('ar') === 0) return 'ar';
                    if (code.indexOf('en') === 0) return 'en';
                }
            } catch (e) { }
            return '<!--DEFAULT_LANG-->';
        })();

        function setLanguage(lang) {
            currentLang = lang;
            try {
                localStorage.setItem('gtoolix_language', lang);
                localStorage.setItem('siteLang', lang);
            } catch (e) { }
            if (typeof window.updateI18n === 'function') {
                window.updateI18n(lang);
            }
            if (typeof loadPopularTools === 'function') {
                loadPopularTools();
            }
        }

        // Mobile Nav Drawer Toggle
        function toggleNav(forceClose) {
            const links = document.getElementById('site-nav-links');
            const btn = document.getElementById('nav-toggle');
            const backdrop = document.getElementById('nav-backdrop');
            if (!links || !btn) return;
            const shouldOpen = forceClose === true ? false : !links.classList.contains('is-open');
            links.classList.toggle('is-open', shouldOpen);
            if (backdrop) backdrop.classList.toggle('is-open', shouldOpen);
            document.body.classList.toggle('menu-open', shouldOpen);
            btn.setAttribute('aria-expanded', String(shouldOpen));
        }

        // Scroll Reveal Observer
        function initScrollReveal() {
            const elements = document.querySelectorAll('.reveal-on-scroll, .reveal');
            if (!elements.length) return;

            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion || !('IntersectionObserver' in window)) {
                elements.forEach(el => el.classList.add('in-view'));
                return;
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        // Also trigger stagger children if any
                        entry.target.querySelectorAll('.stagger-item').forEach(child => {
                            child.classList.add('in-view');
                        });
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.08,
                rootMargin: '0px 0px -40px 0px'
            });

            elements.forEach(el => observer.observe(el));
        }

        // =====================================================================
        // REUSABLE FEATURE BLOCKS (4 MICRO-INTERACTIONS)
        // =====================================================================
        function initFeatureInteractions() {
            const isReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

            // 1. Clip-Path Word-by-Word Text Reveal for Headings
            function prepareWordMasks() {
                document.querySelectorAll('.gt-feature-heading').forEach(heading => {
                    const text = heading.textContent.trim();
                    if (!text || heading.querySelector('.gt-word-mask')) return;
                    if (isReducedMotion) return;

                    const words = text.split(/\s+/).filter(Boolean);
                    heading.innerHTML = words.map((word, i) => {
                        const delay = (i * 65) + 'ms';
                        return `<span class="gt-word-mask"><span class="gt-word-inner" style="transition-delay:${delay}">${word}</span></span>`;
                    }).join(' ');
                });
            }

            window.prepareFeatureHeadings = prepareWordMasks;
            prepareWordMasks();

            if (isReducedMotion || !canHover || window.innerWidth < 960) return;

            // 2. Mouse-Following Spotlight Glow & 3D Internal Parallax
            document.querySelectorAll('.gt-feature-visual-wrap').forEach(wrap => {
                const card = wrap.querySelector('.gt-mockup-card');
                if (!card) return;

                const badge = wrap.querySelector('.gt-parallax-badge');
                const icons = wrap.querySelectorAll('.gt-parallax-icon');
                const sub = wrap.querySelector('.gt-parallax-sub');
                const tags = wrap.querySelector('.gt-parallax-tags');

                let rafId = null;
                let targetRotX = 0, targetRotY = 0;
                let currentRotX = 0, currentRotY = 0;
                let targetX = 0, targetY = 0;
                let currentX = 0, currentY = 0;
                let isHovering = false;

                function updateParallax() {
                    if (!isHovering && Math.abs(currentRotX) < 0.01 && Math.abs(currentRotY) < 0.01) {
                        card.style.transform = '';
                        if (badge) badge.style.transform = '';
                        icons.forEach(ic => ic.style.transform = '');
                        if (sub) sub.style.transform = '';
                        if (tags) tags.style.transform = '';
                        rafId = null;
                        return;
                    }

                    // Smooth damping
                    currentRotX += (targetRotX - currentRotX) * 0.12;
                    currentRotY += (targetRotY - currentRotY) * 0.12;
                    currentX += (targetX - currentX) * 0.12;
                    currentY += (targetY - currentY) * 0.12;

                    card.style.transform = `perspective(1000px) rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;

                    if (badge) {
                        badge.style.transform = `translate3d(${(currentX * -10).toFixed(2)}px, ${(currentY * -10).toFixed(2)}px, 35px)`;
                    }
                    icons.forEach(ic => {
                        ic.style.transform = `translate3d(${(currentX * 6).toFixed(2)}px, ${(currentY * 6).toFixed(2)}px, 20px)`;
                    });
                    if (sub) {
                        sub.style.transform = `translate3d(${(currentX * 4).toFixed(2)}px, ${(currentY * 4).toFixed(2)}px, 15px)`;
                    }
                    if (tags) {
                        tags.style.transform = `translate3d(${(currentX * 5).toFixed(2)}px, ${(currentY * 5).toFixed(2)}px, 20px)`;
                    }

                    rafId = requestAnimationFrame(updateParallax);
                }

                wrap.addEventListener('mouseenter', () => {
                    isHovering = true;
                    card.style.setProperty('--spot-opacity', '1');
                    if (!rafId) rafId = requestAnimationFrame(updateParallax);
                });

                wrap.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    card.style.setProperty('--spot-x', `${x.toFixed(1)}px`);
                    card.style.setProperty('--spot-y', `${y.toFixed(1)}px`);

                    const cx = rect.width / 2;
                    const cy = rect.height / 2;
                    targetX = (x - cx) / cx;
                    targetY = (y - cy) / cy;

                    targetRotX = targetY * -7;
                    targetRotY = targetX * 7;
                });

                wrap.addEventListener('mouseleave', () => {
                    isHovering = false;
                    targetRotX = 0;
                    targetRotY = 0;
                    targetX = 0;
                    targetY = 0;
                    card.style.setProperty('--spot-opacity', '0');
                });
            });

            // 3. Magnetic CTA Buttons
            document.querySelectorAll('.gt-feature-block .gt-btn').forEach(btn => {
                let bRaf = null;
                let targetBX = 0, targetBY = 0;
                let currentBX = 0, currentBY = 0;
                let isBtnHovered = false;

                function updateMagnetic() {
                    if (!isBtnHovered && Math.abs(currentBX) < 0.05 && Math.abs(currentBY) < 0.05) {
                        btn.style.transform = '';
                        bRaf = null;
                        return;
                    }

                    currentBX += (targetBX - currentBX) * 0.2;
                    currentBY += (targetBY - currentBY) * 0.2;

                    btn.style.transform = `translate3d(${currentBX.toFixed(2)}px, ${currentBY.toFixed(2)}px, 0)`;
                    bRaf = requestAnimationFrame(updateMagnetic);
                }

                btn.addEventListener('mouseenter', () => {
                    isBtnHovered = true;
                    if (!bRaf) bRaf = requestAnimationFrame(updateMagnetic);
                });

                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    targetBX = (e.clientX - cx) * 0.32;
                    targetBY = (e.clientY - cy) * 0.32;
                });

                btn.addEventListener('mouseleave', () => {
                    isBtnHovered = false;
                    targetBX = 0;
                    targetBY = 0;
                });
            });
        }

        // Sticky Navbar scroll opacity effect
        function initNavbarScroll() {
            const header = document.getElementById('site-header');
            if (!header) return;
            window.addEventListener('scroll', () => {
                header.classList.toggle('is-scrolled', window.scrollY > 20);
            }, { passive: true });
        }

        async function loadPopularTools() {
            if (!window.GToolixContent) return;
            const grid = document.querySelector('.gt-preview-grid');
            if (!grid) return;

            try {
                const rawTools = await GToolixContent.getTools();
                const activeSlugs = new Set(['qr-code-generator', 'youtube-thumbnail-downloader', 'screen-recorder-studio', 'image-compressor']);
                const tools = (rawTools || []).filter(t => t && t.slug && activeSlugs.has(t.slug) && !t.slug.includes('gemini'));
                if (Array.isArray(tools) && tools.length > 0) {
                    const isAr = currentLang === 'ar';
                    const cardsHtml = tools.map((tool) => {
                        const name = isAr ? (tool.name_ar || tool.nameAr || tool.name) : (tool.name_en || tool.name);
                        const desc = isAr ? (tool.description_ar || tool.descriptionAr || tool.description) : (tool.description_en || tool.description);
                        const badge = isAr ? (tool.badgeAr || tool.badge_text || tool.badge || '') : (tool.badge || tool.badge_text || '');
                        const slug = tool.slug;
                        const icon = tool.icon || 'qr';

                        let iconSvg = '';
                        let iconWrapClass = 'gt-tool-icon-wrap';
                        let tileClass = `gt-tool-tile gt-tool-tile--${icon === 'youtube' ? 'thumb' : (icon === 'recorder' ? 'recorder' : (icon === 'compressor' ? 'compressor' : 'qr'))}`;
                        
                        if (icon === 'qr') {
                            iconWrapClass += ' icon-qr';
                            iconSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><path d="M14 14h3v3h-3z" /><path d="M18 18h3v3h-3z" /><path d="M14 18h3v3h-3z" /><path d="M18 14h3v3h-3z" /></svg>`;
                        } else if (icon === 'youtube' || icon === 'thumb') {
                            iconWrapClass += ' icon-thumb';
                            iconSvg = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"></polygon></svg>`;
                        } else if (icon === 'recorder' || icon === 'rec') {
                            iconWrapClass += ' icon-rec';
                            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`;
                        } else if (icon === 'compressor') {
                            iconWrapClass += ' icon-compressor';
                            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;
                        } else {
                            iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>`;
                        }

                        const exploreBtn = isAr ? 'استكشف الأداة' : 'Explore Tool';
                        const arrow = isAr ? '←' : '→';

                        return `
                            <a href="${isAr ? '' : '/en'}/tools/${slug}" class="${tileClass}" aria-label="${name}">
                                <div class="gt-tool-tile-top">
                                    <div class="${iconWrapClass}">
                                        ${iconSvg}
                                    </div>
                                    ${badge ? `<span class="gt-tool-badge">${badge}</span>` : ''}
                                </div>
                                <h3 class="gt-tool-tile-title">${name}</h3>
                                <p class="gt-tool-tile-desc">${desc}</p>
                                <span class="gt-tool-tile-link">
                                    <span>${exploreBtn}</span>
                                    <span class="dir-arrow">${arrow}</span>
                                </span>
                            </a>
                        `;
                    }).join('');

                    const viewAllLabel = isAr ? 'عرض جميع الأدوات' : 'View All Tools';
                    const arrow = isAr ? '←' : '→';
                    const allCardHtml = `
                        <a href="${isAr ? '' : '/en'}/tools" class="gt-tool-tile gt-tool-tile--all" aria-label="${viewAllLabel}">
                            <div class="gt-tool-all-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" rx="1.5" />
                                    <rect x="14" y="3" width="7" height="7" rx="1.5" />
                                    <rect x="3" y="14" width="7" height="7" rx="1.5" />
                                    <rect x="14" y="14" width="7" height="7" rx="1.5" />
                                </svg>
                            </div>
                            <span class="gt-tool-all-label">
                                <span>${viewAllLabel}</span>
                                <span class="dir-arrow">${arrow}</span>
                            </span>
                        </a>
                    `;

                    grid.innerHTML = cardsHtml + allCardHtml;
                }
            } catch (e) {
                console.warn('Dynamic popular tools rendering fallback:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pc = document.getElementById('particles');
            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (pc && !reduceMotion && window.innerWidth > 1023) {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 25; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 8 + 's';
                    p.style.animationDuration = (Math.random() * 8 + 8) + 's';
                    fragment.appendChild(p);
                }
                pc.appendChild(fragment);
            }
            initScrollReveal();
            initFeatureInteractions();
            initNavbarScroll();
            loadPopularTools();
            if (typeof window.updateI18n === 'function') {
                window.updateI18n(currentLang);
            }
        });
    </script>
    <script src="/static/js/content-client.js"></script>
    <script src="/static/js/theme.min.js" defer></script>
    <script src="/static/js/client.min.js" defer></script>
</body>
</html>
