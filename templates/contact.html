<!DOCTYPE html>
<!--HTML_TAG-->

<head>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <script src="/static/js/lang-detect.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!--SEO_HEAD-->

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9332457707004456" crossorigin="anonymous"></script>

    <!-- Performance: Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/cairo-arabic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/inter-latin.woff2" crossorigin>
    <link rel="preload" as="image" type="image/webp" href="/static/img/logo.webp">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap">

    <!-- Critical Inline Styles -->
    <style>
        :root {
            --bg: #020817;
            --bg-secondary: #0F172A;
            --card: #111827;
            --border: #1E293B;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.04);
            --primary: #2563EB;
            --primary-hover: #3B82F6;
            --accent: #06B6D4;
            --text: #F8FAFC;
            --text-secondary: #94A3B8;
            --radius-full: 9999px;
            --radius-md: 1rem;
            --nav-bg: rgba(2, 8, 23, 0.82);
        }

        [data-theme="light"] {
            --bg: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --card: #FFFFFF;
            --border: #E2E8F0;
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass: rgba(255, 255, 255, 0.7);
            --primary: #2563EB;
            --text: #0F172A;
            --text-secondary: #475569;
            --nav-bg: rgba(248, 250, 252, 0.85);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: clip;
            scrollbar-gutter: stable;
            width: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: clip;
            width: 100%;
            min-height: 100svh;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        html[dir="rtl"] body {
            font-family: 'Cairo', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .site-nav {
            position: fixed;
            top: 0.75rem;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.45rem 0.85rem;
            margin: 0 auto;
            max-width: 1180px;
            width: min(100% - 2rem, 1180px);
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
            min-height: 56px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .site-nav__brand {
            display: flex;
            align-items: center;
            direction: ltr;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
            background: none;
            border: none;
            min-height: 44px;
            cursor: pointer;
        }

        .site-nav__logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 9px;
            display: block;
        }

        .site-nav__right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 2.5rem;
            align-items: start;
            margin-top: 2rem;
        }

        @media (max-width: 860px) {
            .contact-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        .contact-info-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2rem;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
        }

        .contact-form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2.25rem;
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .status-alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16A34A;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #DC2626;
        }
    </style>
    <link rel="preload" href="/static/css/main.min.css" as="style">
    <link rel="stylesheet" href="/static/css/main.min.css" id="gtoolix-main-css" fetchpriority="high">

    <!--JSON_LD-->
</head>

<body>
    <!--SITE_NAV-->

    <div class="background-gradient"></div>
    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="particles" id="particles"></div>

    <main class="container" style="max-width: 1100px; padding-top: clamp(6.75rem, 11vw, 8.5rem); padding-bottom: 4rem; margin: 0 auto; padding-inline: max(1rem, 3.5vw);">
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
            <ol>
                <li><a href="<!--BRAND_HREF-->"><!--BREADCRUMB_HOME--></a></li>
                <li class="separator" aria-hidden="true">/</li>
                <li aria-current="page"><!--PAGE_BREADCRUMB--></li>
            </ol>
        </nav>

        <!-- Header Section -->
        <header class="section-head reveal in-view" style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 0.85rem;">
                <!--PAGE_H1-->
            </h1>
            <p style="color: var(--text-secondary); max-width: 680px; margin: 0 auto; font-size: 1.1rem; line-height: 1.7;">
                <!--PAGE_LEAD-->
            </p>
        </header>

        <div class="contact-layout reveal in-view">
            <!-- Left Info Block -->
            <div class="contact-info-card">
                <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text);"><!--INFO_TITLE--></h2>
                
                <div style="margin-bottom: 1.75rem;">
                    <div style="font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem;"><!--EMAIL_TITLE--></div>
                    <a href="mailto:gtoolix@gmail.com" style="color: var(--primary); text-decoration: none; font-size: 1.05rem; font-weight: 700;">gtoolix@gmail.com</a>
                    <div style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.2rem;"><!--SLA_TAG--></div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 1.5rem;">
                    <div style="font-weight: 600; font-size: 0.95rem; margin-bottom: 0.35rem;"><!--FAQ_PROMPT_TITLE--></div>
                    <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.85rem;"><!--FAQ_PROMPT_DESC--></p>
                    <a href="<!--FAQ_HREF-->" class="btn btn-outline" style="display: inline-block; padding: 0.5rem 1.15rem; font-size: 0.88rem; text-decoration: none;"><!--FAQ_PROMPT_BTN--></a>
                </div>
            </div>

            <!-- Right Form Block -->
            <div class="contact-form-card">
                <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text);"><!--FORM_TITLE--></h2>

                <div id="contact-status-alert" class="status-alert" role="alert"></div>

                <form id="contact-form" onsubmit="submitContactForm(event)">
                    <input type="text" id="hp_field" name="hp_field" style="display: none !important;" tabindex="-1" autocomplete="off">

                    <div class="form-group">
                        <label for="contact-name"><!--LBL_NAME--></label>
                        <input type="text" id="contact-name" name="name" class="form-control" placeholder="<!--PH_NAME-->" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-email"><!--LBL_EMAIL--></label>
                        <input type="email" id="contact-email" name="email" class="form-control" placeholder="<!--PH_EMAIL-->" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-subject"><!--LBL_SUBJECT--></label>
                        <input type="text" id="contact-subject" name="subject" class="form-control" placeholder="<!--PH_SUBJECT-->" required>
                    </div>

                    <div class="form-group">
                        <label for="contact-message"><!--LBL_MSG--></label>
                        <textarea id="contact-message" name="message" class="form-control" rows="5" placeholder="<!--PH_MSG-->" required></textarea>
                    </div>

                    <button type="submit" id="contact-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 600; cursor: pointer;">
                        <span id="contact-btn-spinner" style="display: none; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-inline-end: 8px;"></span>
                        <span id="contact-btn-text"><!--BTN_SUBMIT--></span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!--SITE_FOOTER-->

    <script>
        function toggleNav(forceClose) {
            const links = document.getElementById('site-nav-links');
            const btn = document.getElementById('nav-toggle');
            const backdrop = document.getElementById('nav-backdrop');
            if (!links || !btn) return;
            const shouldOpen = forceClose === true ? false : !links.classList.contains('is-open');
            links.classList.toggle('is-open', shouldOpen);
            if (backdrop) backdrop.classList.toggle('is-open', shouldOpen);
            document.body.classList.toggle('menu-open', shouldOpen);
            btn.setAttribute('aria-expanded', String(shouldOpen));
        }

        function submitContactForm(e) {
            e.preventDefault();
            const form = document.getElementById('contact-form');
            const btn = document.getElementById('contact-submit-btn');
            const spinner = document.getElementById('contact-btn-spinner');
            const btnText = document.getElementById('contact-btn-text');
            const alertBox = document.getElementById('contact-status-alert');

            if (document.getElementById('hp_field').value !== '') return;

            const isEn = window.location.pathname.startsWith('/en');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = isEn ? 'Sending...' : 'جارٍ الإرسال...';
            alertBox.style.display = 'none';

            const formData = new FormData(form);
            fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                alertBox.className = 'status-alert status-success';
                alertBox.textContent = isEn
                    ? 'Thank you! Your message has been sent successfully. We will reply within 24 hours.'
                    : 'شكراً لك! تم استلام رسالتك بنجاح وسنقوم بالرد عليك في غضون 24 ساعة.';
                alertBox.style.display = 'block';
                form.reset();
            })
            .catch(() => {
                alertBox.className = 'status-alert status-error';
                alertBox.textContent = isEn
                    ? 'Sorry, failed to send. Please contact us directly at gtoolix@gmail.com'
                    : 'عذراً، تعذر إرسال الرسالة حالياً. يُرجى مراسلتنا مباشرة عبر gtoolix@gmail.com';
                alertBox.style.display = 'block';
            })
            .finally(() => {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = isEn ? 'Send Message' : 'إرسال الرسالة';
            });
        }
    </script>
    <script src="/static/js/theme.min.js" defer></script>
    <script src="/static/js/client.min.js" defer></script>
</body>
</html>
