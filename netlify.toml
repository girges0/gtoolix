[build]
  command = "node scripts/build-assets.js"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Route Redirects
[[redirects]]
  from = "/qr-code-generator"
  to = "/tools/qr/"
  status = 200

[[redirects]]
  from = "/youtube-thumbnail-downloader"
  to = "/tools/thumbnail/"
  status = 200

[[redirects]]
  from = "/gemini-watermark-remover"
  to = "/tools/gemini/"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service/"
  status = 200

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer/"
  status = 200

[[redirects]]
  from = "/cookies-policy"
  to = "/cookies-policy/"
  status = 200

[[redirects]]
  from = "/dmca"
  to = "/dmca/"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq/"
  status = 200

[[redirects]]
  from = "/screen-recorder-studio"
  to = "/screen-recorder-studio/"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 200

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Performance & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self)"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"
