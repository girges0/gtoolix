[build]
  command = "node scripts/build-assets.js"
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Route Redirects
[[redirects]]
  from = "/monitoring/*"
  to = "/gtoolix-monitoring-site/:splat"
  status = 200

[[redirects]]
  from = "/monitoring"
  to = "/gtoolix-monitoring-site/"
  status = 200

[[redirects]]
  from = "/qr-code-generator"
  to = "/tools/qr/"
  status = 200

[[redirects]]
  from = "/youtube-thumbnail-downloader"
  to = "/tools/thumbnail/"
  status = 200

[[redirects]]
  from = "/gemini-watermark-remover"
  to = "/tools/gemini/"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 200

[[redirects]]
